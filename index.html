/* =====================================================================
   EXPORT / IMPORT
   ===================================================================== */
function download(filename, text, mime) {
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}
async function shareOrDownload(filename, text, mime) {
  try {
    const file = new File([text], filename, { type: mime });
    if (navigator.canShare && matchMedia('(pointer: coarse)').matches && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: filename });
      return true;
    }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  download(filename, text, mime);
  return true;
}
async function backup() {
  const text = JSON.stringify({ app: 'the-home-app', exported: new Date().toISOString(), ...state }, null, 1);
  const ok = await shareOrDownload(`home-app-backup-${today()}.json`, text, 'application/json');
  if (ok) { state.settings.lastBackup = today(); commit(); toast('Backup saved'); }
}
function restoreFromFile(file) {
  const r = new FileReader();
  r.onload = async () => {
    try {
      const data = JSON.parse(r.result);
      if (!data || !Array.isArray(data.tasks)) throw new Error('bad');
      if (!(await confirmSheet('Restore backup?', `This replaces your current list (${plural(state.tasks.length, 'task')}) with the backup (${plural(data.tasks.length, 'task')}).`, 'Restore', true))) return;
      delete data.app; delete data.exported;
      state = migrate(data); state.settings.onboarded = true; commit(); toast('Backup restored');
    } catch { toast('That file is not a Home App backup'); }
  };
  r.readAsText(file);
}
function icsEscape(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
function icsFold(line) {
  const cps = Array.from(line); if (cps.length <= 70) return line;
  const out = []; for (let i = 0; i < cps.length; i += 70) out.push((i ? ' ' : '') + cps.slice(i, i + 70).join(''));
  return out.join('\r\n');
}
function buildICS(tasks) {
  const now = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//The Home App//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Home Maintenance'];
  for (const t of tasks) for (const it of t.items) {
    const s = schedOf(t, it);
    let start = it.due < today() ? today() : it.due, rule;
    if (s.type === 'months') {
      start = it.due.slice(0, 8) + '01';
      if (start < today().slice(0, 8) + '01') start = today().slice(0, 8) + '01';
      rule = `FREQ=YEARLY;BYMONTH=${[...s.months].sort((a, b) => a - b).join(',')};BYMONTHDAY=1`;
    } else {
      rule = `FREQ=${{ d: 'DAILY', w: 'WEEKLY', m: 'MONTHLY', y: 'YEARLY' }[s.unit]};INTERVAL=${s.every}`;
      if (s.season && s.season.length && s.season.length < 12 && s.unit !== 'y') rule += `;BYMONTH=${[...s.season].sort((a, b) => a - b).join(',')}`;
    }
    const d = start.replace(/-/g, ''), dEnd = addDays(start, 1).replace(/-/g, '');
    const title = `${iconOf(t)} ${t.name}${itemName(t, it) ? ` (${itemName(t, it)})` : ''}`;
    const desc = `${describeSched(s)}${s.type === 'months' ? ' (any day this month)' : ''}\n\n${t.notes || ''}${it.notes ? `\n\nNote: ${it.notes}` : ''}`;
    L.push('BEGIN:VEVENT', `UID:${t.id}-${it.id}@the-home-app`, `DTSTAMP:${now}`, `DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${dEnd}`, `RRULE:${rule}`,
      `SUMMARY:${icsEscape(title)}`, `DESCRIPTION:${icsEscape(desc)}`, 'TRANSP:TRANSPARENT',
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEscape(t.name)}`, 'TRIGGER:PT9H', 'END:VALARM', 'END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n') + '\r\n';
}

/* =====================================================================
   TOAST
   ===================================================================== */
let toastTimer;
function toast(msg, actionLabel, action) {
  const el = $('#toast'), btn = $('#toast-btn');
  $('#toast-msg').textContent = msg;
  if (actionLabel) { btn.textContent = actionLabel; btn.classList.remove('hidden'); btn.onclick = () => { el.classList.remove('show'); action(); }; }
  else { btn.classList.add('hidden'); btn.onclick = null; }
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), actionLabel ? 5500 : 2800);
}

/* =====================================================================
   EVENTS
   ===================================================================== */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;
  const t = el.dataset.t ? findTask(el.dataset.t) : null;
  const it = t && el.dataset.i ? findItem(t, el.dataset.i) : null;
  if (['lib-add', 'lib-open', 'lib-add-cat'].includes(a)) { ev.preventDefault(); ev.stopPropagation(); }
  switch (a) {
    case 'tab': ui.tab = el.dataset.tab; safeSet('homeapp.tab', ui.tab); closeAllSheets(); renderAll(); window.scrollTo(0, 0); break;
    case 'close': closeSheet(); break;
    case 'open': if (t) openDetail(t.id, el.dataset.i); break;
    case 'done': {
      ev.stopPropagation();
      if (!t || !it) break;
      el.classList.add('done');
      const row = el.closest('.row'); if (row) row.classList.add('leaving');
      if (navigator.vibrate) navigator.vibrate(12);
      setTimeout(() => markDone(t, it), 600);
      break;
    }
    case 'done-today': if (it) markDone(t, it); break;
    case 'done-on': if (it) openDoneOn(t, it); break;
    case 'item-more': if (it) itemMenu(t, it); break;
    case 'history': if (it) openHistory(t, it); break;
    case 'hist-del': if (it) {
      snapshot(t); it.hist.splice(+el.dataset.idx, 1);
      it.last = it.hist.length ? last(it.hist).d : null;
      commit(); toast('Entry deleted', 'Undo', undo);
    } break;
    case 'add-item': if (t) openItemEditor(t.id); break;
    case 'edit-task': if (t) openTaskEditor(t.id); break;
    case 'new-task': openTaskEditor(); break;
    case 'delete-task': if (t && await confirmSheet('Delete this task?', `“${esc(t.name)}” and all of its history will be deleted.`, 'Delete', true)) {
      snapshot(t); state.tasks = state.tasks.filter(x => x.id !== t.id); closeSheet(); commit(); toast('Task deleted', 'Undo', undo);
    } break;
    case 'ics-task': if (t) download(`${t.name.replace(/[^\w]+/g, '-').toLowerCase()}.ics`, buildICS([t]), 'text/calendar'); break;
    case 'due-cat': ui.dueCat = el.dataset.cat; renderMain(); break;
    case 'tasks-cat': ui.tasksCat = el.dataset.cat; renderMain(); break;
    case 'tasks-seg': ui.tab = 'tasks'; ui.tasksSeg = el.dataset.seg; renderAll(); break;
    case 'toggle-later': ui.showLater = !ui.showLater; renderMain(); break;
    case 'toggle-recent': ui.showRecent = !ui.showRecent; renderMain(); break;
    case 'lib-fit': ui.libFit = !ui.libFit; renderMain(); break;
    case 'lib-add': {
      const lib = LIBRARY.find(l => l.id === el.dataset.lib);
      if (lib) { const nt = taskFromLib(lib); state.tasks.push(nt); commit(); toast(`Added “${lib.name}”`, 'Open', () => openDetail(nt.id)); }
      break;
    }
    case 'lib-open': { const ex = state.tasks.find(x => x.libId === el.dataset.lib); if (ex) openDetail(ex.id); break; }
    case 'lib-add-cat': {
      const added = addedLibIds(), feats = state.settings.features, q = ui.libQuery.trim().toLowerCase();
      const list = LIBRARY.filter(l => l.cat === el.dataset.cat && !added.has(l.id) && (!ui.libFit || libFits(l, feats)) && (!q || (l.name + ' ' + l.notes).toLowerCase().includes(q)));
      list.forEach(l => state.tasks.push(taskFromLib(l)));
      commit(); toast(`Added ${plural(list.length, 'task')}`);
      break;
    }
    case 'feat': {
      const k = el.dataset.k, f = state.settings.features;
      state.settings.features = f.includes(k) ? f.filter(x => x !== k) : [...f, k];
      commit(); break;
    }
    case 'suggest-fit': openSuggestFit(); break;
    case 'theme': state.settings.theme = el.dataset.v; commit(); break;
    case 'soon': state.settings.soonDays = +el.dataset.v; commit(); break;
    case 'hemi': {
      const v = el.dataset.v; if (v === state.settings.hemisphere) break;
      const shift = state.tasks.length && await confirmSheet('Switch hemisphere?', 'Also shift the months on the seasonal tasks you already have by six months? Suggestions you add later will match the new hemisphere either way.', 'Shift my tasks', false, 'Only new suggestions');
      state.settings.hemisphere = v;
      if (shift) for (const tk of state.tasks) {
        const isSeasonal = tk.sched.type === 'months' || (tk.sched.season && tk.sched.season.length);
        tk.sched = shiftSched(tk.sched);
        for (const i2 of tk.items) { if (i2.sched) i2.sched = shiftSched(i2.sched); if (isSeasonal || i2.sched) recalcItem(tk, i2); }
      }
      commit(); break;
    }
    case 'export-ics': {
      if (!state.tasks.length) { toast('Add some tasks first'); break; }
      download('home-maintenance.ics', buildICS(state.tasks), 'text/calendar');
      toast('Calendar file downloaded. Open it to add the events.');
      break;
    }
    case 'backup': backup(); break;
    case 'nag-later': state.settings.backupNagUntil = addDays(today(), 30); commit(); break;
    case 'restore': $('#restore-file').click(); break;
    case 'onboard': openOnboarding(); break;
    case 'reset': if (await confirmSheet('Erase everything?', 'All tasks, history and settings on this device will be deleted. Consider backing up first.', 'Erase', true)) {
      state = blankState(); commit(); openOnboarding();
    } break;
  }
});
document.addEventListener('keydown', ev => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[role="button"][data-act]')) { ev.preventDefault(); ev.target.click(); }
  if (ev.key === 'Escape' && sheetStack.length) closeSheet();
});
$('#restore-file').addEventListener('change', ev => { const f = ev.target.files[0]; if (f) restoreFromFile(f); ev.target.value = ''; });

// Refresh when the day changes or the app returns to the foreground
let lastDay = today();
document.addEventListener('visibilitychange', () => { if (!document.hidden && today() !== lastDay) { lastDay = today(); renderAll(); } });
setInterval(() => { if (today() !== lastDay) { lastDay = today(); renderAll(); } }, 60000);

/* ---------- boot ---------- */
renderAll();
if (!state.settings.onboarded) openOnboarding();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !/^(localhost|127\.)/.test(location.hostname)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
